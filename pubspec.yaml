name: anikku
description: Anikku for Flutter, with a focus-first Apple TV experience.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  html: ^0.15.7
  http: ^1.6.0
  path_provider: ^2.1.6
  path_provider_tvos: ^0.0.3
  shared_preferences: ^2.5.6
  shared_preferences_tvos: ^0.0.2
  video_player: ^2.14.1
  video_player_tvos: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/test/playback.mp4
